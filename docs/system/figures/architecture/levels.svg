<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2800" height="1420" viewBox="0 0 2800 1420" id="bvstk-levels-overview" role="img" aria-labelledby="title desc" data-pl-original-height="1330">
  <title id="title">Уровни абстракции BVSTK</title>
  <desc id="desc">Декларация пяти уровней абстракции BVSTK. L4 — приложения; L3 — сервисы и драйверы; L2 — ядро ОС; L1 — платформа; L0 — аппаратура. Каждая строка определяет область ответственности уровня. Порядок строк не задаёт порядок вызовов. Названия открывают соответствующие подробные схемы. Цвета совпадают со всем рядом архитектурных схем.</desc>
  <defs>
    <style>text{font-family:DejaVu Sans,sans-serif;fill:#233747;} a{cursor:pointer;} a:hover text{text-decoration:underline;} g:target&gt;rect{stroke-width:4;}</style>
  </defs>
  <rect id="page" x="0" y="0" width="2800" height="1330" fill="white" />
  <text x="60" y="47" font-size="16" font-weight="700" text-anchor="start" style="fill:#607487">BVSTK</text>
  <text x="60" y="98" font-size="40" font-weight="700" text-anchor="start" style="fill:#233747">Уровни абстракции BVSTK</text>
  <text x="60" y="144" font-size="23" font-weight="400" text-anchor="start" style="fill:#576c7b">Принятое в проекте деление системы.</text>
  <g id="series-navigation" data-kind="navigation">
    <a data-navigation="sheet" xlink:href="levels.svg">
