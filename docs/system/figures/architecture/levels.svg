      <rect x="2336" y="64" width="80" height="46" rx="8" fill="white" stroke="#287f73" stroke-width="1" />
      <text x="2376.0" y="94" font-size="21" font-weight="700" text-anchor="middle" style="fill:#287f73">L3</text>
    </a>
    <a data-navigation="sheet" xlink:href="architecture_bvstk_l1.svg">
