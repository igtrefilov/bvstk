    <text x="1260" y="523" font-size="27" font-weight="400" text-anchor="start" style="fill:#233747">Логика подсистем, протоколы, сеть и файловые системы.</text>
  </g>
  <g id="level-l2" data-kind="layer-definition" data-layer="L2" data-label="Ядро ОС">
    <rect x="180" y="626" width="2440" height="146" rx="10" fill="#ffd1c7" stroke="#c65b4e" stroke-width="1.7" />
    <a data-navigation="level" xlink:href="architecture_bvstk_os.svg#os-kernels">
      <text x="228" y="714" font-size="40" font-weight="700" text-anchor="start" style="fill:#c65b4e">L2</text>
      <text x="416" y="712" font-size="34" font-weight="700" text-anchor="start" style="fill:#233747">Ядро ОС</text>
    </a>
    <text x="1260" y="711" font-size="27" font-weight="400" text-anchor="start" style="fill:#233747">Планирование, синхронизация и обмен сообщениями.</text>
  </g>
  <g id="level-l1" data-kind="layer-definition" data-layer="L1" data-label="Платформа">
    <rect x="180" y="814" width="2440" height="146" rx="10" fill="#fff0d6" stroke="#b56b1d" stroke-width="1.7" />
    <a data-navigation="level" xlink:href="architecture_bvstk_l1.svg">
      <text x="228" y="902" font-size="40" font-weight="700" text-anchor="start" style="fill:#b56b1d">L1</text>
      <text x="416" y="900" font-size="34" font-weight="700" text-anchor="start" style="fill:#233747">Платформа</text>
    </a>
    <text x="1260" y="899" font-size="27" font-weight="400" text-anchor="start" style="fill:#233747">Общие интерфейсы, порты ОС и BSP.</text>
  </g>
  <g id="level-l0" data-kind="layer-definition" data-layer="L0" data-label="Аппаратура">
    <rect x="180" y="1002" width="2440" height="146" rx="10" fill="#e9eef3" stroke="#607487" stroke-width="1.7" />
    <a data-navigation="level" xlink:href="architecture_bvstk_l0_l1.svg#hardware-panel">
      <text x="228" y="1090" font-size="40" font-weight="700" text-anchor="start" style="fill:#607487">L0</text>
      <text x="416" y="1088" font-size="34" font-weight="700" text-anchor="start" style="fill:#233747">Аппаратура</text>
    </a>
    <text x="1260" y="1087" font-size="27" font-weight="400" text-anchor="start" style="fill:#233747">Процессор, память и периферия.</text>
  </g>
  <text x="180" y="1238" font-size="23" font-weight="400" text-anchor="start" style="fill:#576c7b">Названия слоёв открывают соответствующие схемы.</text>
  <g id="pl-subsystem-navigation" data-kind="navigation">
    <rect x="0" y="1330.0" width="2800.0" height="90.0" fill="white" />
