      <text x="84" y="400.0" font-size="21" font-weight="700" text-anchor="start" style="fill:#607487">Событие</text>
      <text x="429" y="400.0" font-size="21" font-weight="700" text-anchor="start" style="fill:#8760ba">Действие ядра PL</text>
      <text x="1084" y="400.0" font-size="21" font-weight="700" text-anchor="start" style="fill:#8760ba">Признаки IRQ</text>
      <text x="1509" y="400.0" font-size="21" font-weight="700" text-anchor="start" style="fill:#287f73">Обработка PS</text>
      <path d="M70,432 L2110,432" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="465" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">Адрес не выбран</text>
      <text x="429" y="465" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">ADDR → IDLE</text>
      <text x="429" y="492" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">SDA отпущена</text>
      <text x="1084" y="465" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Нет нового события</text>
      <text x="1509" y="465" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Запрос не поступает</text>
      <path d="M70,524 L2110,524" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="557" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">STOP или Sr после записи</text>
      <text x="429" y="557" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Хвост → заголовок</text>
      <text x="429" y="584" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">STOP → IDLE; Sr → ADDR</text>
      <text x="1084" y="557" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">DATA_VALID</text>
      <text x="1084" y="584" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">FINAL_PACKET</text>
      <text x="1509" y="557" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Прочитать фрагмент</text>
      <text x="1509" y="584" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Завершить запись</text>
      <path d="M70,616 L2110,616" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="649" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">NACK ведущего при чтении</text>
      <text x="429" y="649" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">READ_ACK → DONE</text>
      <text x="429" y="676" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Ожидание STOP или Sr</text>
      <text x="1084" y="649" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Без ERR_ACK</text>
      <text x="1084" y="676" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Без FINAL_PACKET</text>
      <text x="1509" y="649" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Ждать границу фазы</text>
      <path d="M70,708 L2110,708" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="741" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">STOP или Sr при чтении</text>
      <text x="429" y="741" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">data_ctrl → WAIT_EVENT</text>
      <text x="1084" y="741" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">FINAL_PACKET без DATA_VALID</text>
      <text x="1084" y="768" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Возможен ERR_ACK*</text>
      <text x="1509" y="741" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Снять read_armed</text>
      <path d="M70,800 L2110,800" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="833" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">Тайм-аут первого байта</text>
      <text x="429" y="833" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">WAIT_PACKET → ERR_ACK</text>
      <text x="429" y="860" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">NACK адреса; ждать STOP или Sr</text>
      <text x="1084" y="833" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">ERR_ACK</text>
      <text x="1509" y="833" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Снять read_armed</text>
      <text x="1509" y="860" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Поздний ответ не возобновляет чтение</text>
      <path d="M70,892 L2110,892" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="925" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">Тайм-аут следующего байта</text>
      <text x="429" y="925" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">READ_BYTE: выдать 0xFF</text>
      <text x="429" y="952" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Ждать ACK ведущего</text>
      <text x="1084" y="925" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">ERR_ACK</text>
      <text x="1509" y="925" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Снять read_armed</text>
      <text x="1509" y="952" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Шина ещё может быть занята</text>
      <path d="M70,984 L2110,984" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="1017" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">Новый фрагмент при неснятом</text>
      <text x="84" y="1044" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">IRQ</text>
      <text x="429" y="1017" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Новый заголовок записан</text>
      <text x="429" y="1044" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Предыдущие данные могли потеряться</text>
      <text x="1084" y="1017" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">MEM_OVERFLOW</text>
      <text x="1084" y="1044" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">DATA_VALID</text>
      <text x="1509" y="1017" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Ошибка; отменить ответ</text>
      <path d="M70,1076 L2110,1076" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
      <text x="84" y="1109" font-size="19" font-weight="400" text-anchor="start" style="fill:#607487">Сброс ядра</text>
      <text x="429" y="1109" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">Сброс состояний и карты адресов</text>
      <text x="429" y="1136" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">BRAM сохраняется</text>
      <text x="1084" y="1109" font-size="19" font-weight="400" text-anchor="start" style="fill:#8760ba">IRQ снят</text>
      <text x="1509" y="1109" font-size="19" font-weight="400" text-anchor="start" style="fill:#287f73">Восстановить карту адресов</text>
      <path d="M70,1168 L2110,1168" fill="none" stroke="#ced6dd" stroke-width="1.2" stroke-linejoin="round" />
    </g>
