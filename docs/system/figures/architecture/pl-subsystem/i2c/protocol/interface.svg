  <g id="annotations">
    <text x="60" y="42.0" font-size="16" font-weight="700" text-anchor="start" style="fill:#607487">BVSTK</text>
    <text x="60" y="94.0" font-size="36" font-weight="700" text-anchor="start" style="fill:#233747">I²C: линии и участники</text>
    <text x="60" y="151.0" font-size="21" font-weight="400" text-anchor="start" style="fill:#576c7b" xml:space="preserve"><tspan style="fill:#607487">L0</tspan><tspan>. SDA, SCL и открытый сток.</tspan></text>
    <g id="bus" data-kind="protocol-section" data-layer="L0">
      <rect x="60" y="256" width="2080" height="86" fill="none" stroke="#607487" stroke-width="0" />
      <text x="60" y="290.0" font-size="28" font-weight="700" text-anchor="start" style="fill:#233747">Две общие линии</text>
      <text x="60" y="330.0" font-size="21" font-weight="400" text-anchor="start" style="fill:#576c7b">SDA — данные. SCL — такты от ведущего.</text>
    </g>
    <text x="90" y="448.0" font-size="25" font-weight="700" text-anchor="start" style="fill:#233747">SDA</text>
    <text x="90" y="523.0" font-size="25" font-weight="700" text-anchor="start" style="fill:#233747">SCL</text>
    <text x="1950" y="391.0" font-size="17" font-weight="400" text-anchor="end" style="fill:#233747">R₁</text>
    <text x="2050" y="391.0" font-size="17" font-weight="400" text-anchor="end" style="fill:#233747">R₂</text>
    <text x="2020" y="315.0" font-size="22" font-weight="700" text-anchor="middle" style="fill:#233747">VDD</text>
    <text x="369" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SDA</text>
    <text x="649" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SCL</text>
    <text x="1079" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SDA</text>
    <text x="1359" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SCL</text>
    <text x="1729" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SDA</text>
    <text x="2009" y="604.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#233747">SCL</text>
    <text x="60" y="905.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#576c7b">Открытый сток: участник тянет линию в 0; подтяжка поднимает отпущенную линию в 1.</text>
    <text x="60" y="959.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#576c7b">Любой участник может удерживать 0. Свободная шина: SDA = SCL = 1. Земля общая.</text>
    <g id="bit" data-kind="protocol-section" data-layer="L0">
      <rect x="60" y="1041" width="2080" height="52" fill="none" stroke="#607487" stroke-width="0" />
      <text x="60" y="1075.0" font-size="28" font-weight="700" text-anchor="start" style="fill:#233747">Бит читается при высоком SCL</text>
    </g>
    <text x="205" y="1196.0" font-size="22" font-weight="700" text-anchor="end" style="fill:#607487">SCL</text>
    <text x="205" y="1336.0" font-size="22" font-weight="700" text-anchor="end" style="fill:#3f75ad">SDA</text>
    <text x="500" y="1410.0" font-size="25" font-weight="700" text-anchor="middle" style="fill:#3f75ad">1</text>
    <text x="960" y="1410.0" font-size="25" font-weight="700" text-anchor="middle" style="fill:#3f75ad">0</text>
    <text x="1380" y="1195.0" font-size="23" font-weight="400" text-anchor="start" style="fill:#233747">SCL = 1: SDA стабильна</text>
    <text x="1380" y="1226.74" font-size="23" font-weight="400" text-anchor="start" style="fill:#233747">SCL = 0: смена бита</text>
    <a data-navigation="detail" xlink:href="transaction.svg#conditions">
      <text x="1380" y="1345.0" font-size="20" font-weight="700" text-anchor="start" style="fill:#3f75ad">START и STOP — отдельные условия</text>
    </a>
    <g id="clock-stretching" data-kind="protocol-section" data-layer="L0">
      <rect x="60" y="1516" width="2080" height="52" fill="none" stroke="#607487" stroke-width="0" />
      <text x="60" y="1550.0" font-size="28" font-weight="700" text-anchor="start" style="fill:#233747">Clock stretching: удержание SCL в 0</text>
    </g>
    <text x="205" y="1676.0" font-size="22" font-weight="700" text-anchor="end" style="fill:#607487">SCL</text>
    <text x="525" y="1800.0" font-size="19" font-weight="400" text-anchor="middle" style="fill:#233747">Ведущий отпустил SCL</text>
    <text x="985" y="1840.0" font-size="19" font-weight="400" text-anchor="middle" style="fill:#233747">Устройство отпустило SCL</text>
    <text x="1380" y="1650.0" font-size="23" font-weight="400" text-anchor="start" style="fill:#233747">Ведущий ждёт SCL = 1.</text>
    <text x="1380" y="1681.74" font-size="23" font-weight="400" text-anchor="start" style="fill:#233747">Поддержка зависит от участников.</text>
    <text x="60" y="1945.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#576c7b">Двунаправленный I²C: один ведущий, 7-битные адреса. Адреса условные, масштаб времени условный.</text>
