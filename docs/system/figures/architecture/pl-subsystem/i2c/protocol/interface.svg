  "article_notes": [
    "SDA — данные. SCL — такты от ведущего.",
    "Открытый сток: участник тянет линию в 0; подтяжка поднимает отпущенную линию в 1.",
    "Любой участник может удерживать 0. Свободная шина: SDA = SCL = 1. Земля общая.",
    "Двунаправленный I²C: один ведущий, 7-битные адреса. Адреса условные, масштаб времени условный."
  ]
}</metadata>
