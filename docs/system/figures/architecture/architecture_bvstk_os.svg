<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2800" height="1396" viewBox="0 199 2800 1396" id="bvstk-os-overview" role="img" aria-labelledby="title desc">
  <title id="title">BVSTK в двух ОС</title>
  <desc id="desc">Структура двух альтернативных сборок BVSTK. FreeRTOS находится слева, Нейтрино справа, общий код — в центре. Пунктирные рамки обозначают принадлежность к ОС, цвет — уровень абстракции. Показаны приложения, системные службы, ядра и реализации платформы. Общий код включает прикладную логику, логику подсистем и интерфейсы платформы; он входит в каждую сборку отдельно. Аппаратура общая. Положение блоков показывает их место в структуре. Подробности раскрываются по ссылкам в заголовках.</desc>
