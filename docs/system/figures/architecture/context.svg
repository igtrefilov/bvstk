<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="350" viewBox="0 0 1200 350"
     role="img" aria-labelledby="title desc">
  <title id="title">BVSTK между ведущим и ведомым устройством</title>
  <desc id="desc">Внешний ведущий подключён к ведомой стороне BVSTK.
    Ведущая сторона BVSTK подключена к ведомому устройству.
    Каждое подключение образует отдельный участок шины.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #303030; }
      a { cursor: pointer; }
      a:hover text { text-decoration: underline; }
      g:target > rect { stroke-width: 3; }
      .block { fill: white; stroke: #606060; stroke-width: 2; }
      .bus { fill: none; stroke: #707070; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="350" fill="white" />

  <g id="host-bus" data-kind="bus" data-members="host slave-side">
    <path class="bus" d="M100 280 H490" stroke-width="4" />
    <path class="bus" d="M160 220 V280 M460 220 V280" stroke-width="2.5" />
    <circle cx="160" cy="280" r="4" fill="#707070" />
    <circle cx="460" cy="280" r="4" fill="#707070" />
    <text x="295" y="319" font-size="21" text-anchor="middle">Шина ведущего</text>
  </g>
  <g id="device-bus" data-kind="bus" data-members="master-side device">
    <path class="bus" d="M710 280 H1100" stroke-width="4" />
    <path class="bus" d="M740 220 V280 M1040 220 V280" stroke-width="2.5" />
    <circle cx="740" cy="280" r="4" fill="#707070" />
    <circle cx="1040" cy="280" r="4" fill="#707070" />
    <text x="905" y="319" font-size="21" text-anchor="middle">Шина ведомого</text>
  </g>

  <g id="host" data-kind="participant">
    <rect class="block" x="40" y="92" width="240" height="128" rx="12" />
    <a xlink:href="pl-subsystem/overview/bridge.svg#host">
      <text x="160" y="150" font-size="25" font-weight="700" text-anchor="middle">
        <tspan x="160">Внешний</tspan>
        <tspan x="160" dy="34">ведущий</tspan>
      </text>
    </a>
  </g>
  <g id="bridge" data-kind="system-boundary">
    <rect class="block" x="340" y="36" width="520" height="184" rx="14" />
    <a xlink:href="pl-subsystem/overview/bridge.svg#bridge">
      <text x="600" y="101" font-size="30" font-weight="700" text-anchor="middle">BVSTK</text>
    </a>
    <g id="slave-side" data-kind="bus-role">
      <a xlink:href="pl-subsystem/overview/bridge.svg#pl_slave">
        <text x="460" y="184" font-size="21" text-anchor="middle">Ведомая сторона</text>
      </a>
    </g>
    <g id="master-side" data-kind="bus-role">
      <a xlink:href="pl-subsystem/overview/bridge.svg#pl_master">
        <text x="740" y="184" font-size="21" text-anchor="middle">Ведущая сторона</text>
      </a>
    </g>
  </g>
  <g id="device" data-kind="participant">
    <rect class="block" x="920" y="92" width="240" height="128" rx="12" />
    <a xlink:href="pl-subsystem/overview/bridge.svg#device">
      <text x="1040" y="150" font-size="25" font-weight="700" text-anchor="middle">
        <tspan x="1040">Ведомое</tspan>
        <tspan x="1040" dy="34">устройство</tspan>
      </text>
    </a>
  </g>
</svg>
