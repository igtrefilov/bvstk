  <title id="title">Драйвер slave: публикация окна ответа</title>
  <desc id="desc">IRQ slave с RD_REQUEST начинает обработку в PS. Порт вызывает сервис, затем передаёт окно драйверу. Запись BRAM предшествует rd_valid.</desc>
