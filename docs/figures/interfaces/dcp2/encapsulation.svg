  <title id="title">DCP2 внутри Ethernet, IPv4 и TCP</title>
  <desc id="desc">Упрощённая вложенность сетевых форматов: Ethernet содержит пакет IPv4, IPv4 — сегмент TCP. Данные TCP несут байты потока DCP2. Размеры полей условные; опции и заполнение Ethernet не показаны.</desc>
