  <title id="title">Снимок CACHE и последующие изменения</title>
  <desc id="desc">SUBSCRIBE фиксирует снимок S с ревизией R. GET читает его оставшиеся страницы. Только после завершения снимка сервер выдаёт события R+1, R+2 из журнала.</desc>
