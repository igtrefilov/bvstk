  <title id="title">Открытие, чтение и закрытие потока FS</title>
  <desc id="desc">OPEN связывает open_id клиента с дескриптором H сервера. READ использует H и последовательные номера блоков. EOF завершает содержимое, CLOSE освобождает поток.</desc>
