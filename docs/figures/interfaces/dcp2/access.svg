<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" viewBox="0 20 2000 1758" role="img" aria-labelledby="title desc" height="1758">
  <title id="title">Внешний клиент DCP2 и части BVSTK</title>
  <desc id="desc">Клиент подключается через Ethernet и TCP к серверу L4. Команды устройств проходят через сервисы L3, MEM обращается к разрешённым аппаратным адресам через L1. FS читает файлы. Сервер возвращает результаты и события. Драйверы и порты ОС опущены.</desc>
