  <title id="title">Общая структура кадра DCP2</title>
  <desc id="desc">Заголовок DCP2 занимает 8 байт: magic, ver и dcp_len. Полезная нагрузка начинается с srv, op и seq, затем идёт body переменной длины. Смещения полей указаны от начала кадра DCP2; ширина ячеек условная.</desc>
