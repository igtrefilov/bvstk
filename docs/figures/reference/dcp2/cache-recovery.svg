  <title id="title">Повторная синхронизация CACHE</title>
  <desc id="desc">После RESYNC_REQUIRED клиент отмечает свою копию как несогласованную. Сервер приостанавливает подписку. Новый SUBSCRIBE и полный снимок позволяют возобновить последовательное применение изменений.</desc>
