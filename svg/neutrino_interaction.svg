<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="210mm"
   height="180mm"
   viewBox="0 0 210 180"
   version="1.1"
   id="neutrino-interaction"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="neutrino_interaction.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">ЗОСРВ «Нейтрино» · взаимодействие уровней</title>
  <desc id="description">
    Уровни Нейтрино показаны только номером и цветом. Межуровневое
    взаимодействие проходит через L2 — микроядро и базовый IPC-механизм;
    прямых связей между внешними уровнями нет.
  </desc>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     inkscape:showpageshadow="2" />
  <defs id="defs">
    <style id="style">
      text { font-family: &quot;Noto Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif; fill: #000000; stroke: none; text-anchor: middle; }
      .title { font-size: 5px; font-weight: 700; }
      .level-number { font-size: 4.8px; font-weight: 700; }
      .note { font-size: 2.8px; font-weight: 500; }
      .frame { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linejoin: round; }
      .level { stroke-width: 0.65; }
      .kernel-gateway { fill: #ffd1c7; fill-opacity: 0.25; stroke: #c65b4e; stroke-width: 0.65; stroke-dasharray: 2 1; }
      .kernel-link { fill: none; stroke: #c65b4e; stroke-width: 0.5; stroke-linecap: round; marker-start: url(#arrow-head); marker-end: url(#arrow-head); }

      /* Палитра уровней совпадает с architecture_platform.svg и levels.svg. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
      .level-l2 { fill: #ffd1c7; stroke: #c65b4e; }
      .level-l3 { fill: #d9f0ea; stroke: #287f73; }
      .level-l4 { fill: #d9ebff; stroke: #3f75ad; }
    </style>
    <marker
       id="arrow-head"
       viewBox="0 0 8 8"
       refX="7.5"
       refY="4"
       markerWidth="1.8"
       markerHeight="1.8"
       markerUnits="userSpaceOnUse"
       orient="auto-start-reverse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#c65b4e" stroke="none" />
    </marker>
  </defs>

  <g id="sheet" inkscape:groupmode="layer" inkscape:label="Нейтрино · связи уровней">
    <rect id="frame" class="frame" x="7" y="7" width="196" height="166" />
    <text id="title-label" class="title" x="105" y="15">ЗОСРВ «Нейтрино» · взаимодействие уровней</text>

    <g id="kernel" inkscape:label="L2 · микроядро и IPC">
      <circle id="kernel-gateway" class="kernel-gateway" cx="105" cy="85" r="15" />
    </g>

    <g id="communication" inkscape:label="IPC через L2">
      <!-- Единственные маршруты взаимодействия: каждый внешний уровень ↔ L2. -->
      <path id="kernel-link-l4" class="kernel-link" d="M 105,48 C 98,55 98,68 105,75" />
      <path id="kernel-link-l3" class="kernel-link" d="M 143,85 C 136,78 123,78 115,85" />
      <path id="kernel-link-l1" class="kernel-link" d="M 105,122 C 112,115 112,102 105,95" />
      <path id="kernel-link-l0" class="kernel-link" d="M 67,85 C 74,92 87,92 95,85" />
    </g>

    <g id="levels" inkscape:label="L4–L0">
      <circle id="level-l4" class="level level-l4" cx="105" cy="38" r="10" />
      <text id="level-l4-number" class="level-number" x="105" y="39.7">L4</text>
      <circle id="level-l3" class="level level-l3" cx="153" cy="85" r="10" />
      <text id="level-l3-number" class="level-number" x="153" y="86.7">L3</text>
      <circle id="level-l2" class="level level-l2" cx="105" cy="85" r="10" />
      <text id="level-l2-number" class="level-number" x="105" y="86.7">L2</text>
      <circle id="level-l1" class="level level-l1" cx="105" cy="132" r="10" />
      <text id="level-l1-number" class="level-number" x="105" y="133.7">L1</text>
      <circle id="level-l0" class="level level-l0" cx="57" cy="85" r="10" />
      <text id="level-l0-number" class="level-number" x="57" y="86.7">L0</text>
    </g>

    <text id="note" class="note" x="105" y="158">Любое взаимодействие: Lx ↔ L2 ↔ Ly · IPC через микроядро</text>
  </g>
</svg>
