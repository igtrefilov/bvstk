<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="210mm"
   height="210mm"
   viewBox="0 0 210 210"
   version="1.1"
   id="freertos-levels"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="freertos_level.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">FreeRTOS · уровни L4–L0</title>
  <desc id="description">
    Упрощённая конкретизация функциональных уровней для FreeRTOS на Zynq-7000.
    Каждый функциональный элемент показан отдельным подблоком. Цвета совпадают с levels.svg.
  </desc>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     inkscape:showpageshadow="2" />
  <defs id="defs">
    <style id="style">
      text { font-family: &quot;Noto Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif; fill: #000000; stroke: none; text-anchor: middle; }
      .title { font-size: 5px; font-weight: 700; }
      .level-name { font-size: 3.8px; font-weight: 700; }
      .subblock-label { font-size: 2.35px; font-weight: 500; }
      .frame { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linejoin: round; }
      .level { stroke-width: 0.45; stroke-linejoin: round; }
      .subblock { fill: #ffffff; fill-opacity: 0.62; stroke-width: 0.28; stroke-linejoin: round; }

      /* Палитра уровней совпадает с levels.svg. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
      .level-l2 { fill: #ffd1c7; stroke: #c65b4e; }
      .level-l3 { fill: #d9f0ea; stroke: #287f73; }
      .level-l4 { fill: #d9ebff; stroke: #3f75ad; }
      .subblock-l0 { stroke: #607487; }
      .subblock-l1 { stroke: #b56b1d; }
      .subblock-l2 { stroke: #c65b4e; }
      .subblock-l3 { stroke: #287f73; }
      .subblock-l4 { stroke: #3f75ad; }
    </style>
  </defs>

  <g id="sheet" inkscape:groupmode="layer" inkscape:label="FreeRTOS · уровни ОС">
    <rect id="frame" class="frame" x="7" y="7" width="196" height="196" />
    <text id="title-label" class="title" x="105" y="15">FreeRTOS · уровни L4–L0</text>

    <g id="levels" inkscape:label="L4–L0">
      <rect id="level-l4" class="level level-l4" x="20" y="25" width="170" height="26" />
      <text id="level-l4-name" class="level-name" x="105" y="31">L4 · Приложение</text>
      <rect id="f-l4-tasks" class="subblock subblock-l4" x="23" y="35" width="80" height="11" rx="0.5" />
      <text id="f-l4-tasks-label" class="subblock-label" x="63" y="41.5">Прикладные задачи</text>
      <rect id="f-l4-logic" class="subblock subblock-l4" x="107" y="35" width="80" height="11" rx="0.5" />
      <text id="f-l4-logic-label" class="subblock-label" x="147" y="41.5">Пользовательская логика</text>

      <rect id="level-l3" class="level level-l3" x="20" y="54" width="170" height="35" />
      <text id="level-l3-name" class="level-name" x="105" y="60">L3 · Системные сервисы и драйверы</text>
      <rect id="f-l3-lwip" class="subblock subblock-l3" x="23" y="63" width="52" height="10" rx="0.5" />
      <text id="f-l3-lwip-label" class="subblock-label" x="49" y="69">lwIP</text>
      <rect id="f-l3-fatfs" class="subblock subblock-l3" x="79" y="63" width="52" height="10" rx="0.5" />
      <text id="f-l3-fatfs-label" class="subblock-label" x="105" y="69">FatFs</text>
      <rect id="f-l3-crypto" class="subblock subblock-l3" x="135" y="63" width="52" height="10" rx="0.5" />
      <text id="f-l3-crypto-label" class="subblock-label" x="161" y="69">Криптография</text>
      <rect id="f-l3-peripheral" class="subblock subblock-l3" x="23" y="75" width="80" height="10" rx="0.5" />
      <text id="f-l3-peripheral-label" class="subblock-label" x="63" y="81">Драйверы периферии</text>
      <rect id="f-l3-logical" class="subblock subblock-l3" x="107" y="75" width="80" height="10" rx="0.5" />
      <text id="f-l3-logical-label" class="subblock-label" x="147" y="81">Логические драйверы</text>

      <rect id="level-l2" class="level level-l2" x="20" y="92" width="170" height="43" />
      <text id="level-l2-name" class="level-name" x="105" y="98">L2 · Ядро FreeRTOS</text>
      <rect id="f-l2-tasks" class="subblock subblock-l2" x="23" y="101" width="38.75" height="11" rx="0.5" />
      <text id="f-l2-tasks-label" class="subblock-label" x="42.375" y="107.8">Задачи</text>
      <rect id="f-l2-scheduler" class="subblock subblock-l2" x="65.25" y="101" width="38.75" height="11" rx="0.5" />
      <text id="f-l2-scheduler-label" class="subblock-label" x="84.625" y="107.8">Планировщик</text>
      <rect id="f-l2-priority" class="subblock subblock-l2" x="107.5" y="101" width="38.75" height="11" rx="0.5" />
      <text id="f-l2-priority-label" class="subblock-label" x="126.875" y="107.8">Приоритеты</text>
      <rect id="f-l2-queues" class="subblock subblock-l2" x="149.75" y="101" width="38.75" height="11" rx="0.5" />
      <text id="f-l2-queues-label" class="subblock-label" x="169.125" y="107.8">Очереди</text>
      <rect id="f-l2-semaphores" class="subblock subblock-l2" x="23" y="116" width="52" height="11" rx="0.5" />
      <text id="f-l2-semaphores-label" class="subblock-label" x="49" y="122.8">Семафоры</text>
      <rect id="f-l2-mutexes" class="subblock subblock-l2" x="79" y="116" width="52" height="11" rx="0.5" />
      <text id="f-l2-mutexes-label" class="subblock-label" x="105" y="122.8">Мьютексы</text>
      <rect id="f-l2-timers" class="subblock subblock-l2" x="135" y="116" width="52" height="11" rx="0.5" />
      <text id="f-l2-timers-label" class="subblock-label" x="161" y="122.8">Таймеры</text>

      <rect id="level-l1" class="level level-l1" x="20" y="138" width="170" height="31" />
      <text id="level-l1-name" class="level-name" x="105" y="144">L1 · OS-порт и BSP</text>
      <rect id="f-l1-arm" class="subblock subblock-l1" x="23" y="147" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-arm-label" class="subblock-label" x="49" y="153">ARM_CA9</text>
      <rect id="f-l1-cpu" class="subblock subblock-l1" x="79" y="147" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-cpu-label" class="subblock-label" x="105" y="153">CPU0</text>
      <rect id="f-l1-context" class="subblock subblock-l1" x="135" y="147" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-context-label" class="subblock-label" x="161" y="153">Контекст и tick</text>
      <rect id="f-l1-bsp" class="subblock subblock-l1" x="23" y="158.5" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-bsp-label" class="subblock-label" x="49" y="164.5">BSP</text>
      <rect id="f-l1-memory" class="subblock subblock-l1" x="79" y="158.5" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-memory-label" class="subblock-label" x="105" y="164.5">Память</text>
      <rect id="f-l1-peripheral" class="subblock subblock-l1" x="135" y="158.5" width="52" height="9.5" rx="0.5" />
      <text id="f-l1-peripheral-label" class="subblock-label" x="161" y="164.5">Периферийные драйверы</text>

      <rect id="level-l0" class="level level-l0" x="20" y="172" width="170" height="28" />
      <text id="level-l0-name" class="level-name" x="105" y="178">L0 · Аппаратный уровень Zynq</text>
      <rect id="f-l0-ps" class="subblock subblock-l0" x="23" y="181" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-ps-label" class="subblock-label" x="42.375" y="186">PS</text>
      <rect id="f-l0-cortex" class="subblock subblock-l0" x="65.25" y="181" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-cortex-label" class="subblock-label" x="84.625" y="186">Cortex-A9</text>
      <rect id="f-l0-ddr" class="subblock subblock-l0" x="107.5" y="181" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-ddr-label" class="subblock-label" x="126.875" y="186">DDR</text>
      <rect id="f-l0-gic" class="subblock subblock-l0" x="149.75" y="181" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-gic-label" class="subblock-label" x="169.125" y="186">GIC</text>
      <rect id="f-l0-pl" class="subblock subblock-l0" x="23" y="191" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-pl-label" class="subblock-label" x="42.375" y="196">PL</text>
      <rect id="f-l0-axi" class="subblock subblock-l0" x="65.25" y="191" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-axi-label" class="subblock-label" x="84.625" y="196">AXI GP</text>
      <rect id="f-l0-mmio" class="subblock subblock-l0" x="107.5" y="191" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-mmio-label" class="subblock-label" x="126.875" y="196">MMIO/BRAM</text>
      <rect id="f-l0-irq" class="subblock subblock-l0" x="149.75" y="191" width="38.75" height="7.5" rx="0.5" />
      <text id="f-l0-irq-label" class="subblock-label" x="169.125" y="196">IRQ_F2P</text>
    </g>
  </g>
</svg>
