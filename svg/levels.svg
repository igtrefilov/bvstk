<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="210mm"
   height="180mm"
   viewBox="0 0 210 180"
   version="1.1"
   id="os-levels"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="levels.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title
     id="title">Абстрактные уровни ОС L4–L0</title>
  <desc
     id="description">
    Единая абстрактная модель функциональных уровней операционной системы
    от прикладного уровня L4 до аппаратного уровня L0. Цвета и порядок
    уровней задаётся единой палитрой проекта. Состав конкретного уровня
    может отличаться между ОС; схема не задаёт обязательный маршрут вызовов.
  </desc>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pagecheckerboard="0"
     inkscape:zoom="1.5478125"
     inkscape:cx="396.68888"
     inkscape:cy="340.80355"
     inkscape:window-width="2510"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="levels" />
  <defs
     id="defs">
    <style
       id="style">
      text { font-family: &quot;Noto Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif; fill: #000000; stroke: none; text-anchor: middle; }
      .title { font-size: 5px; font-weight: 700; }
      .subtitle { font-size: 2.8px; font-weight: 400; }
      .level-name { font-size: 4px; font-weight: 700; }
      .level-content { font-size: 2.8px; font-weight: 400; }
      .note { font-size: 2.35px; font-weight: 400; }
      .frame { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linejoin: round; }
      .level { stroke-width: 0.45; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #000000; stroke-width: 0.28; marker-end: url(#arrow-head); }

      /* Единая палитра уровней проекта. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
      .level-l2 { fill: #ffd1c7; stroke: #c65b4e; }
      .level-l3 { fill: #d9f0ea; stroke: #287f73; }
      .level-l4 { fill: #d9ebff; stroke: #3f75ad; }
    </style>
    <marker
       id="arrow-head"
       viewBox="0 0 8 8"
       refX="7.5"
       refY="4"
       markerWidth="1.8"
       markerHeight="1.8"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M 0,0 L 8,4 L 0,8 Z"
         fill="#000000"
         stroke="none"
         id="path11735" />
    </marker>
  </defs>
  <g
     id="sheet"
     inkscape:groupmode="layer"
     inkscape:label="Уровни ОС">
    <rect
       id="frame"
       class="frame"
       x="7"
       y="7"
       width="196"
       height="166" />
    <text
       id="title-label"
       class="title"
       x="105"
       y="15">Уровни ОС</text>
    <g
       id="levels"
       inkscape:label="L4–L0">
      <rect
         id="level-l4"
         class="level level-l4"
         x="20"
         y="27"
         width="170"
         height="20" />
      <text
         id="level-l4-name"
         class="level-name"
         x="105"
         y="35.5">L4 · Приложения</text>
      <text
         id="level-l4-content"
         class="level-content"
         x="105"
         y="42.5">Пользовательская логика</text>
      <path
         id="arrow-l4-l3"
         class="arrow"
         d="M 105,47.5 V 50" />
      <rect
         id="level-l3"
         class="level level-l3"
         x="20"
         y="50"
         width="170"
         height="22" />
      <text
         id="level-l3-name"
         class="level-name"
         x="105"
         y="58.5">L3 · Системные сервисы и драйверы</text>
      <text
         id="level-l3-content"
         class="level-content"
         x="105"
         y="66">Библиотеки · сеть · файловые системы · драйверы</text>
      <path
         id="arrow-l3-l2"
         class="arrow"
         d="M 105,72.5 V 75" />
      <rect
         id="level-l2"
         class="level level-l2"
         x="20"
         y="75"
         width="170"
         height="27" />
      <text
         id="level-l2-name"
         class="level-name"
         x="105"
         y="84">L2 · Ядро ОС</text>
      <text
         id="level-l2-content-1"
         class="level-content"
         x="105"
         y="92">Логика ядра ОС</text>
      <path
         id="arrow-l2-l1"
         class="arrow"
         d="M 105,102.5 V 105" />
      <rect
         id="level-l1"
         class="level level-l1"
         x="20"
         y="105"
         width="170"
         height="22" />
      <text
         id="level-l1-name"
         class="level-name"
         x="105"
         y="113.5">L1 · OS-порт и BSP</text>
      <text
         id="level-l1-content"
         class="level-content"
         x="105"
         y="121">Архитектурные механизмы · startup · таймеры · параметры платформы</text>
      <path
         id="arrow-l1-l0"
         class="arrow"
         d="M 105,127.5 V 130" />
      <rect
         id="level-l0"
         class="level level-l0"
         x="20"
         y="130"
         width="170"
         height="26" />
      <text
         id="level-l0-name"
         class="level-name"
         x="105"
         y="139">L0 · Аппаратура</text>
      <text
         id="level-l0-content-1"
         class="level-content"
         x="105"
         y="147">CPU · память · системные и периферийные интерфейсы</text>
    </g>
  </g>
</svg>
