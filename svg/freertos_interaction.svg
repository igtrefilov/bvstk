<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="210mm"
   height="180mm"
   viewBox="0 0 210 180"
   version="1.1"
   id="freertos-interaction"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="freertos_interaction.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">FreeRTOS · взаимодействие уровней</title>
  <desc id="description">
    Уровни FreeRTOS показаны только номером и цветом. Каждый уровень может
    напрямую обращаться к любому другому уровню; стрелки образуют полный граф
    двунаправленных связей.
  </desc>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     inkscape:showpageshadow="2" />
  <defs id="defs">
    <style id="style">
      text { font-family: &quot;Noto Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif; fill: #000000; stroke: none; text-anchor: middle; }
      .title { font-size: 5px; font-weight: 700; }
      .level-number { font-size: 4.8px; font-weight: 700; }
      .note { font-size: 2.8px; font-weight: 500; }
      .frame { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linejoin: round; }
      .level { stroke-width: 0.65; }
      .mesh-link { fill: none; stroke: #59636d; stroke-width: 0.42; stroke-linecap: round; marker-start: url(#arrow-head); marker-end: url(#arrow-head); }

      /* Палитра уровней совпадает с levels.svg. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
      .level-l2 { fill: #ffd1c7; stroke: #c65b4e; }
      .level-l3 { fill: #d9f0ea; stroke: #287f73; }
      .level-l4 { fill: #d9ebff; stroke: #3f75ad; }
    </style>
    <marker
       id="arrow-head"
       viewBox="0 0 8 8"
       refX="7.5"
       refY="4"
       markerWidth="1.8"
       markerHeight="1.8"
       markerUnits="userSpaceOnUse"
       orient="auto-start-reverse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#59636d" stroke="none" />
    </marker>
  </defs>

  <g id="sheet" inkscape:groupmode="layer" inkscape:label="FreeRTOS · связи уровней">
    <rect id="frame" class="frame" x="7" y="7" width="196" height="166" />
    <text id="title-label" class="title" x="105" y="15">FreeRTOS · взаимодействие уровней</text>

    <g id="communication" inkscape:label="Прямые двунаправленные связи">
      <!-- В полном графе каждая пара уровней соединена двунаправленным маршрутом. -->
      <path id="link-l4-l3" class="mesh-link" d="M 113.1,43.9 C 123,45 131,53 140.9,64.1" />
      <path id="link-l3-l2" class="mesh-link" d="M 145.5,79.4 C 149,90 143,101 134.5,108.6" />
      <path id="link-l2-l1" class="mesh-link" d="M 121,118 C 110,114 100,114 89,118" />
      <path id="link-l1-l0" class="mesh-link" d="M 75.5,108.6 C 67,101 61,90 64.5,79.4" />
      <path id="link-l0-l4" class="mesh-link" d="M 69.1,64.1 C 79,53 88,45 96.9,41.9" />

      <path id="link-l4-l2" class="mesh-link" d="M 108.1,47.5 C 123,60 139,83 127.9,108.5" />
      <path id="link-l4-l1" class="mesh-link" d="M 101.9,47.5 C 87,60 71,83 82.1,108.5" />
      <path id="link-l3-l1" class="mesh-link" d="M 140.8,75.7 C 126,83 103,102 87.3,112.3" />
      <path id="link-l3-l0" class="mesh-link" d="M 139,70 C 120,58 90,58 71,70" />
      <path id="link-l2-l0" class="mesh-link" d="M 122.8,112.3 C 107,105 84,83 69.3,75.7" />
    </g>

    <g id="levels" inkscape:label="L4–L0">
      <circle id="level-l4" class="level level-l4" cx="105" cy="38" r="10" />
      <text id="level-l4-number" class="level-number" x="105" y="39.7">L4</text>
      <circle id="level-l3" class="level level-l3" cx="149" cy="70" r="10" />
      <text id="level-l3-number" class="level-number" x="149" y="71.7">L3</text>
      <circle id="level-l2" class="level level-l2" cx="131" cy="118" r="10" />
      <text id="level-l2-number" class="level-number" x="131" y="119.7">L2</text>
      <circle id="level-l1" class="level level-l1" cx="79" cy="118" r="10" />
      <text id="level-l1-number" class="level-number" x="79" y="119.7">L1</text>
      <circle id="level-l0" class="level level-l0" cx="61" cy="70" r="10" />
      <text id="level-l0-number" class="level-number" x="61" y="71.7">L0</text>
    </g>

    <text id="note" class="note" x="105" y="158">Общий ELF · общая память · прямые двунаправленные связи Lx ↔ Ly</text>
  </g>
</svg>
