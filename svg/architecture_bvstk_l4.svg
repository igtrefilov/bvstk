  <title id="title">BVSTK · подробная схема уровня L4</title>
  <desc id="description">
    Подробная схема прикладного уровня L4 проекта BVSTK. Слева показана
    прикладная композиция для FreeRTOS, справа — прикладные процессы и
    клиенты для ЗОСРВ «Нейтрино», а в центре — общие модели и контракты,
    используемые обеими сборками. Прикладные блоки BVSTK обозначены
    штриховой рамкой. Нативные пользовательские приложения базового образа
    Нейтрино показаны сплошной рамкой; для FreeRTOS отдельные предшествующие
    L4-приложения не выделены. Нативные задачи, процессы и системные стеки
    ОС не смешиваются с L4-блоками.
  </desc>
