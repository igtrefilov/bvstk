   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">ЗОСРВ «Нейтрино» · уровни L4–L0</title>
  <desc id="description">
    Упрощённая конкретизация функциональных уровней для ЗОСРВ «Нейтрино» 2024
    на Zynq-7000. Каждый функциональный элемент показан отдельным подблоком.
    Цвета совпадают с levels.svg.
  </desc>
  <sodipodi:namedview
     id="namedview"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     inkscape:showpageshadow="2" />
  <defs id="defs">
    <style id="style">
      text { font-family: &quot;Noto Sans&quot;, &quot;DejaVu Sans&quot;, sans-serif; fill: #000000; stroke: none; text-anchor: middle; }
      .title { font-size: 5px; font-weight: 700; }
      .level-name { font-size: 3.8px; font-weight: 700; }
      .subblock-label { font-size: 2.35px; font-weight: 500; }
      .frame { fill: none; stroke: #000000; stroke-width: 0.5; stroke-linejoin: round; }
      .level { stroke-width: 0.45; stroke-linejoin: round; }
      .subblock { fill: #ffffff; fill-opacity: 0.62; stroke-width: 0.28; stroke-linejoin: round; }

      /* Палитра уровней совпадает с levels.svg. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
      .level-l2 { fill: #ffd1c7; stroke: #c65b4e; }
      .level-l3 { fill: #d9f0ea; stroke: #287f73; }
      .level-l4 { fill: #d9ebff; stroke: #3f75ad; }
      .subblock-l0 { stroke: #607487; }
      .subblock-l1 { stroke: #b56b1d; }
      .subblock-l2 { stroke: #c65b4e; }
      .subblock-l3 { stroke: #287f73; }
      .subblock-l4 { stroke: #3f75ad; }
    </style>
  </defs>

