   viewBox="0 0 420 270"
   version="1.1"
   id="bvstk-l3-architecture"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="architecture_bvstk_l3.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">BVSTK · подробная схема уровня L3</title>
  <desc id="description">
    Подробная схема уровня L3 проекта BVSTK. Слева показаны нативные сетевой
    и файловый стеки FreeRTOS, их OS-привязки и прикладные системные службы;
    справа — нативные стеки и драйверы ЗОСРВ «Нейтрино», сервис устройств и
    адаптеры менеджера ресурсов. В центре показаны общие протоколы, сервисы,
    PL-драйверы и файловые операции. Цвет всех блоков соответствует L3.
    Нативные компоненты имеют сплошную рамку, код BVSTK — штриховую,
    адаптеры — точечную. Состав SMI, SPI и SD выбирается профилем платы.
  </desc>
