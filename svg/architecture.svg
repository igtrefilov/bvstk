<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="210mm" height="297mm" viewBox="0 0 210 297"
     version="1.1" id="zynq7000-rtos-architecture"
     inkscape:version="1.2.2" sodipodi:docname="architecture.svg">
  <title>FreeRTOS и ЗОСРВ «Нейтрино» на Zynq-7000</title>
  <desc>
    Два альтернативных варианта загрузки на двухъядерной платформе Zynq-7000
    проекта bvstk. FreeRTOS показан для установленного Xilinx-порта ARM_CA9,
    работающего на CPU0; Нейтрино — для локального образа с procnto-smp.
    Это схема состава программных компонентов и аппаратных интерфейсов.
    Расположение блоков не задаёт обязательный маршрут вызова каждого API.
    Приложение FreeRTOS, ядро, библиотеки и драйверы связаны в один ELF.
    BSP задаёт общую таблицу MMU; адресные пространства задач не изолированы.
    lwIP и FatFs — дополнительные библиотеки, а не сервисы ядра FreeRTOS.
    Нейтрино предоставляет процессы с изолированной виртуальной памятью;
    драйверы и менеджеры ресурсов работают в процессах пользовательского уровня.
    Микроядро и менеджер процессов совместно образуют модуль procnto-smp.
    Библиотека libc исполняется в контексте каждого вызывающего процесса.
    Доступ драйверов к MMIO отображается через mmap_device_memory;
    обработка IRQ может быть передана потоку через InterruptAttachEvent.
    Для аппаратного доступа локальный порт запрашивает соответствующие привилегии.
    Модули devnp загружаются в io-pkt и не показаны как самостоятельные процессы.
    startup выполняется при загрузке; syspage и callouts используются после запуска.
    DDR — внешняя память платы, её контроллер расположен в PS.
    AXI GP используется для доступа CPU к регистрам и памяти PL;
    IRQ_F2P доставляет прерывания PL контроллеру GIC.
    Подробные локальные источники и ссылки на документацию: custom-sources.md.
  </desc>
