<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="360mm"
   height="210mm"
   viewBox="0 0 360 210"
   version="1.1"
   id="bvstk-os-architecture"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
   sodipodi:docname="architecture_bvstk_os.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">BVSTK · общие части и реализации для FreeRTOS и Нейтрино</title>
  <desc id="description">
    Самостоятельная схема структуры проекта BVSTK. Слева показаны части,
    зависящие от FreeRTOS и Xilinx-порта, справа — части, зависящие от
    Нейтрино и Zynq-порта, а в центре — функциональные группы общего кода,
    переиспользуемые в обеих альтернативных сборках. Цвет каждого блока
    обозначает уровень абстракции: L4 приложения, L3 сервисы и драйверы,
    L2 ядро ОС, L1 OS-порт и BSP, L0 аппаратный контракт и железо.
    Общие модули входят в отдельные образы через соответствующий порт;
    две ОС не запускаются одновременно. Сплошная рамка обозначает нативный
    компонент ОС, штриховая — добавленный BVSTK, точечная — адаптер BVSTK.
  </desc>
  <sodipodi:namedview
