      .origin-os { fill: #536473; }
      .origin-bvstk { fill: #287f73; }
      .origin-adapter { fill: #b56b1d; }
      .empty-module { fill: #ffffff; stroke: #7a8996; stroke-width: 0.4; stroke-dasharray: 1.8 1.1; stroke-linejoin: round; }
      /* Единая палитра уровней из levels.svg и interaction-схем. */
      .level-l0 { fill: #e9eef3; stroke: #607487; }
      .level-l1 { fill: #fff0d6; stroke: #b56b1d; }
